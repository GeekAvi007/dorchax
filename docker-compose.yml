services:
  postgres:
    image: postgres:16-alpine
    container_name: dorchax-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dorchax
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: dorchax_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorchax -d dorchax_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dorchax-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs-init:
    image: alpine:latest
    container_name: dorchax-rustfs-init
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    command: sh -c "mkdir -p /data/rustfs0 /app/logs && chown -R 10001:10001 /data /app/logs"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: dorchax-s3
    restart: unless-stopped
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  rustfs_logs:
